<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PES6 Liga Manager</title>
<meta name="description" content="Los torneos de PES6 entre amigos: fixture, tabla y campeones.">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="./css/app.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/inicio">
      <span class="brand-mark"><i class="ti ti-ball-football"></i></span>
      <span class="brand-text">
        <strong>PES6 Liga</strong>
        <small>Torneos entre amigos</small>
      </span>
    </a>
    <div class="top-actions">
      <button id="btnAdmin" class="ico" title="Entrar como organizador"><i class="ti ti-lock"></i></button>
      <button id="btnScreen" class="ico" title="Modo pantalla"><i class="ti ti-device-tv"></i></button>
      <button id="btnSound" class="ico" title="Sonido"><i class="ti ti-volume"></i></button>
    </div>
  </div>
  <nav class="nav-wide" id="navWide"></nav>
</header>

<main id="view" tabindex="-1"></main>

<nav class="nav-bar" id="navBar"></nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-veil" data-close-sheet></div>
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<div class="modal" id="modal" hidden></div>
<div class="screen-mode" id="screenMode" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="sync" id="sync" hidden><i class="ti ti-refresh"></i> Buscando cambios</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
